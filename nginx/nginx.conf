# GreenCash Nginx Config - aaPanel compatible
# Paste nội dung này vào phần Config của site trong aaPanel
# THAY THẾ HOÀN TOÀN config cũ (xoá hết PHP config)

server {
    listen 80;
    server_name cashback.v3vn.eu;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name cashback.v3vn.eu;

    root /www/wwwroot/cashback.v3vn.eu/public;
    index index.html;

    # ─── SSL ────────────────────────────────────────────────────
    ssl_certificate     /www/server/panel/vhost/cert/cashback.v3vn.eu/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/cashback.v3vn.eu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    error_page 497 https://$host$request_uri;

    # ─── Security headers ────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ─── Gzip ────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;

    # ─── API proxy → Node.js backend port 4000 ──────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ─── Socket.io WebSocket ─────────────────────────────────────
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    # ─── Affiliate short link tracking ───────────────────────────
    location /go/ {
        proxy_pass http://127.0.0.1:4000/api/v1/tracking/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Static assets cache ─────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ─── Let's Encrypt ───────────────────────────────────────────
    location ~ \.well-known {
        allow all;
    }

    # ─── Block sensitive files ───────────────────────────────────
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|LICENSE|README) {
        return 404;
    }

    # ─── React SPA fallback (phải để cuối cùng) ─────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /www/wwwlogs/cashback.v3vn.eu.log;
    error_log  /www/wwwlogs/cashback.v3vn.eu.error.log;
}
